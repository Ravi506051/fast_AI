<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <title>Nova AI — Chat</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">✦</span><span>Nova AI</span></div>
      <button class="new-chat" id="newChat"><span>＋</span> New chat</button>
      <div class="side-label">YOUR SPACE</div>
      <div class="history" id="history"><div class="history-item active">✧ <span>New conversation</span></div></div>
      <div class="sidebar-bottom">
        <div class="profile-avatar">N</div>
        <div><strong>Nova AI</strong><small>Gemini-powered assistant</small></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button>
        <div class="model-name">Nova <span>AI</span> <span class="chevron">⌄</span></div>
        <button class="icon-button" id="clearChat" title="Clear conversation" aria-label="Clear conversation">⟳</button>
      </header>
      <section class="conversation" id="conversation">
        <div class="welcome" id="welcome">
          <div class="welcome-symbol">✦</div>
          <h1>What can I help you with?</h1>
          <p>Ask a question, explore an idea, or get something done.</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt="Explain machine learning in simple words"> <span>◈</span><b>Learn something</b><small>Explain machine learning simply</small></button>
            <button class="suggestion" data-prompt="Give me 5 creative AI project ideas for my portfolio"> <span>⌘</span><b>Brainstorm ideas</b><small>Find a project for my portfolio</small></button>
            <button class="suggestion" data-prompt="Help me write a professional email asking about an internship"> <span>✎</span><b>Write something</b><small>Draft a professional email</small></button>
            <button class="suggestion" data-prompt="Write a Python function to check whether a number is prime, and explain it"> <span>⌁</span><b>Code with me</b><small>Build and understand code</small></button>
          </div>
        </div>
        <div class="messages" id="messages" aria-live="polite"></div>
      </section>
      <div class="composer-wrap">
        <form class="composer" id="chatForm">
          <textarea id="prompt" rows="1" placeholder="Message Nova AI..." aria-label="Message Nova AI"></textarea>
          <div class="composer-footer">
            <div class="composer-hint"><span class="sparkle">✦</span> Gemini · AI can make mistakes</div>
            <button class="send-button" id="sendButton" type="submit" aria-label="Send message"><span>↑</span></button>
          </div>
        </form>
        <p class="disclaimer">Nova AI can make mistakes. Check important information.</p>
      </div>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
